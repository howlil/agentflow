name: Request Agentflow Release

on:
  push:
    branches: [master]
    paths:
      - '.github/release-request.json'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: Dispatch verified npm release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate explicitly requested package version
        id: request
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/master
          VERSION="$(node -p "require('./package.json').version")"
          CLI_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          REQUEST_VERSION="$(node -p "require('./.github/release-request.json').version")"
          REQUEST_PACKAGE="$(node -p "require('./.github/release-request.json').package")"
          test "$VERSION" = "$CLI_VERSION"
          test "$VERSION" = "$REQUEST_VERSION"
          test "$REQUEST_PACKAGE" = '@howlil/agentflow-cli'
          FIRST_LINE="${COMMIT_MESSAGE%%$'\n'*}"
          test "$FIRST_LINE" = "release: request v$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Start existing validated release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.request.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref master --raw-field "version=$RELEASE_TAG"
