name: Native latest compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        host: [claude, codex]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Probe current native CLI compatibility
        env:
          HOST: ${{ matrix.host }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$HOST" = claude ]; then
            version="$(npm view @anthropic-ai/claude-code version)"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            echo "Testing Claude CLI $version"
            npx --yes "@anthropic-ai/claude-code@$version" plugin validate . --strict
          else
            version="$(npm view @openai/codex version)"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            echo "Testing Codex CLI $version"
            npx --yes "@openai/codex@$version" plugin marketplace add .
            npx --yes "@openai/codex@$version" plugin add agentflow@agentflow
            npx --yes "@openai/codex@$version" plugin list | grep -q agentflow
            npx --yes "@openai/codex@$version" plugin remove agentflow@agentflow
          fi
