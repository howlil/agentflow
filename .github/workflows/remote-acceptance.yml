name: Remote Skill Release Acceptance

on:
  workflow_run:
    workflows: ['Publish Agentflow Release']
    types: [completed]
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Published tag to test (e.g. v0.3.0)"
        required: true
        type: string
      previous_ref:
        description: "Optional earlier published tag to exercise replacement and rollback"
        required: false
        type: string

permissions:
  contents: read

jobs:
  remote-acceptance:
    name: Validate published npm CLI and tagged skills
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve target tag only from published release history
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_run ]; then
            [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]] || exit 1
            git cat-file -e "$SOURCE_COMMIT^{commit}"
            VERSION="$(git show "$SOURCE_COMMIT:package.json" |
              node -e "let s='';process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).version))")"
            RELEASE_REF="v$VERSION"
            echo "sha=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          else
            RELEASE_REF="$INPUT_TAG"
          fi
          [[ "$RELEASE_REF" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]] || exit 1
          echo "tag=$RELEASE_REF" >> "$GITHUB_OUTPUT"
      - name: Validate public release and exercise isolated install/rollback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_SHA: ${{ steps.target.outputs.sha }}
          RELEASE_REF: ${{ steps.target.outputs.tag }}
          PREVIOUS_REF: ${{ inputs.previous_ref }}
          DISABLE_TELEMETRY: '1'
        run: bash .github/scripts/remote-acceptance.sh "$RELEASE_REF" "$PREVIOUS_REF"
