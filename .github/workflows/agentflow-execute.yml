name: Agentflow coding request (M1)
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Open owner-authored issue containing the execution contract'
        required: true
        type: number

permissions:
  contents: read
  issues: read

concurrency:
  group: agentflow-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'agentflow:run')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      issue: ${{ steps.meta.outputs.issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate owner-authored contract
        id: meta
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENTFLOW_ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          node scripts/execution/prepare.mjs
          echo "issue=$AGENTFLOW_ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: agentflow-contract
          path: .agentflow-run/
          retention-days: 3
          if-no-files-found: error

  implement:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: agentflow-contract
          path: .agentflow-run
      - name: Run Codex with restricted workspace permissions
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          prompt-file: .agentflow-run/prompt.md
          output-file: .agentflow-run/codex-summary.txt
      - name: Run trusted repository checks
        run: |
          npm run plugins:check
          npm test
          npm run build
      - name: Capture untrusted patch with protected-path checks
        run: node scripts/execution/capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: agentflow-candidate
          path: .agentflow-run/candidate.patch
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: [prepare, implement]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: agentflow-candidate
          path: .agentflow-artifact
      - name: Independently validate and stage artifact
        run: node scripts/execution/publish.mjs .agentflow-artifact/candidate.patch
      - name: Commit isolated branch and create DRAFT PR
        env:
          GH_TOKEN: ${{ secrets.AGENTFLOW_BOT_TOKEN }}
          ISSUE: ${{ needs.prepare.outputs.issue }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          test -n "$GH_TOKEN" || { echo "AGENTFLOW_BOT_TOKEN missing"; exit 1; }
          branch="agentflow/issue-${ISSUE}-run-${RUN_ID}"
          git -c user.name='agentflow[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "feat(agentflow): implement issue #${ISSUE} (run ${RUN_ID})"
          git switch -c "$branch"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --repo "$REPO" --base master --head "$branch" --draft \
            --title "Agentflow: implement issue #${ISSUE}" \
            --body "Implements #${ISSUE}. Repository checks passed; independent requirement-level and runtime review are still required. Run: https://github.com/${REPO}/actions/runs/${RUN_ID}."
