name: Publish Agentflow Release
on:
  push:
    tags:
      - 'v[0-9]*'
    branches:
      - master
    paths:
      - RELEASE_VERSION
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing or new vMAJOR.MINOR.PATCH version on master'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: skill-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify immutable skill release
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Match release request, version and reviewed master ancestry
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          RUN_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$RUN_EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/master ]; then
            REQUESTED_TAG="$(tr -d '\r\n' < RELEASE_VERSION)"
          fi
          [[ "$REQUESTED_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]] || exit 1
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          test "$REQUESTED_TAG" = "v$ROOT_VERSION"
          test "$REQUESTED_TAG" = "$(tr -d '\r\n' < RELEASE_VERSION)"
          grep -Fxq "## $REQUESTED_TAG" CHANGELOG.md
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          if [ "$GITHUB_REF" = refs/heads/master ]; then
            test "$GITHUB_SHA" = "$(git rev-parse origin/master)"
          else
            test "$GITHUB_REF" = "refs/tags/$REQUESTED_TAG"
            test "$(git rev-parse "refs/tags/$REQUESTED_TAG^{commit}")" = "$GITHUB_SHA"
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun run plugins:check
      - run: bun run test
      - run: bun run build
      - name: Verify release ChatGPT package ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-package
          archive="dist-package/agentflow-chatgpt-v$(node -p "require('./package.json').version").zip"
          zip -q -r -X "$archive" .codex-plugin skills assets
          extracted="$(mktemp -d)"
          trap 'rm -rf "$extracted"' EXIT
          unzip -q "$archive" -d "$extracted"
          node scripts/chatgpt-package.mjs --check "$extracted"
      - name: Attest release package provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist-package/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: agentflow-chatgpt-release
          path: dist-package/*.zip
          if-no-files-found: error
  github-release:
    needs: verify
    if: ${{ needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: agentflow-chatgpt-release
          path: dist-package
      - name: Publish GitHub release, never an npm package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG"
            exit 0
          fi
          awk -v heading="## $RELEASE_TAG" '
            $0 == heading { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/agentflow-release-notes.md
          test -s /tmp/agentflow-release-notes.md
          artifact="dist-package/agentflow-chatgpt-$RELEASE_TAG.zip"
          test -s "$artifact"
          gh release create "$RELEASE_TAG" "$artifact" --target "$GITHUB_SHA" --notes-file /tmp/agentflow-release-notes.md --title "Agentflow $RELEASE_TAG"
