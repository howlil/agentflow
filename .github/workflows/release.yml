name: Publish Agentflow Release
on:
  push:
    tags:
      - 'v[0-9]*'
    branches:
      - master
    paths:
      - RELEASE_VERSION
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing or new vMAJOR.MINOR.PATCH version on master'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: skill-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify immutable skill release
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Match release request, version and reviewed master ancestry
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          RUN_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$RUN_EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/master ]; then
            REQUESTED_TAG="$(tr -d '\r\n' < RELEASE_VERSION)"
          fi
          [[ "$REQUESTED_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]] || exit 1
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          test "$REQUESTED_TAG" = "v$ROOT_VERSION"
          test "$REQUESTED_TAG" = "$(tr -d '\r\n' < RELEASE_VERSION)"
          grep -Fxq "## $REQUESTED_TAG" CHANGELOG.md
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          if [ "$GITHUB_REF" = refs/heads/master ]; then
            test "$GITHUB_SHA" = "$(git rev-parse origin/master)"
          else
            test "$GITHUB_REF" = "refs/tags/$REQUESTED_TAG"
            test "$(git rev-parse "refs/tags/$REQUESTED_TAG^{commit}")" = "$GITHUB_SHA"
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run plugins:check
      - run: npm test
      - run: npm run build
  github-release:
    needs: verify
    if: ${{ needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish GitHub release, never an npm package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG"
            exit 0
          fi
          awk -v heading="## $RELEASE_TAG" '
            $0 == heading { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/agentflow-release-notes.md
          test -s /tmp/agentflow-release-notes.md
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --notes-file /tmp/agentflow-release-notes.md --title "Agentflow $RELEASE_TAG"
