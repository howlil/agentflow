name: Publish Agentflow Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify tag belongs to reviewed master history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - run: npm ci
      - run: npm run plugins:check
      - run: npm test
      - run: npm run build
      - name: Validate standalone npm tarball
        run: npm pack --dry-run ./packages/cli

  publish-npm:
    needs: verify
    if: ${{ vars.AGENTFLOW_NPM_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Require npm with trusted-publishing support
        shell: bash
        run: |
          set -euo pipefail
          npm --version
          npm install -g npm@11
          node -e "const [a,b]=process.versions.npm.split('.').map(Number); if (a < 11 || (a === 11 && b < 5)) process.exit(1)"
      - name: Publish scoped CLI using npm OIDC
        working-directory: packages/cli
        run: npm publish --access public
        # Requires @howlil/agentflow-cli already claimed on npm, and a
        # trusted publisher configured for howlil/agentflow + release.yml.
        # No npm auth tokens are stored in GitHub Actions.

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "Agentflow $GITHUB_REF_NAME" --generate-notes --verify-tag
