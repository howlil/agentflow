name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test generator
        run: npm test

      - name: Build docs
        run: npm run build

      - name: Check critical static routes
        run: |
          test -f dist/index.html
          test -f dist/start/choose-a-skill/index.html
          test -f dist/skills/product-design/index.html
          test -f dist/reference/product-design/index.html
