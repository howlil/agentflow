name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
# Cancel only superseded PR checks; release workflows remain independent.
concurrency:
  group: agentflow-ci-${{ github.workflow }-${{ github.event.pull_request.number || github.ref }
  cancel-in-progress: ${{ github.event_name == 'pull_request' }

jobs:
  classify:
    name: Classify changed files
    runs-on: ubuntu-latest
    outputs:
      full_required: ${{ steps.scope.outputs.full_required }
      portable_required: ${{ steps.scope.outputs.portable_required }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Select required verification scope
        id: scope
        shell: bash
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }
          CI_HEAD_SHA: HEAD
        run: |
          set -euo pipefail
          node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"

  verify:
    name: verify
    needs: classify
    if: ${{ always() }
    runs-on: ubuntu-latest
    steps:
      # Required gate: failed classification MUST fail verify; no skipped-green bypass.
      - name: Require valid scope classification
        shell: bash
        env:
          RESULT: ${{ needs.classify.result }
          FULL: ${{ needs.classify.outputs.full_required }
        run: |
          set -euo pipefail
          test "$RESULT" = success
          [[ "$FULL" = true || "$FULL" = false ]]
      - name: Root-docs fast path
        if: ${{ needs.classify.outputs.full_required == 'false' }
        run: echo "Safe root-documentation diff checked; no build or compatibility changes."
      - uses: actions/checkout@v7
        if: ${{ needs.classify.outputs.full_required == 'true' }
      - uses: actions/setup-node@v7
        if: ${{ needs.classify.outputs.full_required == 'true' }
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        if: ${{ needs.classify.outputs.full_required == 'true' }
      - name: Lint workflows
        if: ${{ needs.classify.outputs.full_required == 'true' }
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml
      - run: npm run plugins:check
        if: ${{ needs.classify.outputs.full_required == 'true' }
      - run: npm test
        if: ${{ needs.classify.outputs.full_required == 'true' }
      - run: npm run build
        if: ${{ needs.classify.outputs.full_required == 'true' }
      - name: Verify generated skill discovery index
        if: ${{ needs.classify.outputs.full_required == 'true' }
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/llms.txt
          test -s dist/og.png
          test -s dist/favicon.svg
          test -s dist/social-preview.svg
          grep -Fq 'skills/agentflow/SKILL.md' dist/llms.txt
          test "$(grep -cF 'raw.githubusercontent.com/howlil/agentflow/master/skills/' dist/llms.txt)" -eq 11
      - name: Package ChatGPT skills-only plugin
        if: ${{ needs.classify.outputs.full_required == 'true' }
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-package
          version="$(node -p "require('./package.json').version")"
          zip -q -r -X "dist-package/agentflow-chatgpt-v$version.zip" plugin.json skills assets
          count="$(unzip -Z1 dist-package/*.zip | grep -Ec '^skills/[^/]+/SKILL.md$')"
          test "$count" -eq 11
          unzip -Z1 dist-package/*.zip | grep -Fxq 'plugin.json'
          unzip -Z1 dist-package/*.zip | grep -Fxq 'assets/agentflow.svg'
          extracted="$(mktemp -d)"
          trap 'rm -rf "$extracted"' EXIT
          unzip -q dist-package/*.zip -d "$extracted"
          node scripts/chatgpt-package.mjs --check "$extracted"
          # The shipped archive is the source of truth for acceptance; never
          # validate only the checkout while publishing a different ZIP.
      - uses: actions/upload-artifact@v4
        if: ${{ needs.classify.outputs.full_required == 'true' }
        with:
          name: agentflow-chatgpt-package
          path: dist-package/*.zip
          if-no-files-found: error
      - name: Validate Claude plugin
        if: ${{ needs.classify.outputs.full_required == 'true' }
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate . --strict
      - name: Validate Codex plugin
        if: ${{ needs.classify.outputs.full_required == 'true' }
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @openai/codex@latest plugin marketplace add .
          npx --yes @openai/codex@latest plugin add agentflow@agentflow
          npx --yes @openai/codex@latest plugin list | grep -q agentflow
          npx --yes @openai/codex@latest plugin remove agentflow@agentflow

  cross-agent-compatibility:
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.portable_required == 'true' }
    name: Portable skills / ${{ matrix.agent }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        agent: [claude-code, codex, gemini-cli, cursor, opencode]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test upstream skills installer with current canonical files
        shell: bash
        env:
          AGENT_ID: ${{ matrix.agent }}
          DISABLE_TELEMETRY: '1'
        run: bash .github/scripts/cross-agent-candidate.sh "$AGENT_ID"
