name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Smoke-test portable skill discovery and install/remove
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$PWD"
          TARGET="$(mktemp -d)"
          trap 'rm -rf "$TARGET"' EXIT
          cd "$TARGET"
          npx --yes skills@latest add "$SOURCE" --list | tee discovery.log
          grep -q 'agentflow' discovery.log
          npx --yes skills@latest add "$SOURCE" --skill agentflow --agent codex --copy --yes
          npx --yes skills@latest list -a codex | tee installed.log
          grep -q 'agentflow' installed.log
          npx --yes skills@latest remove agentflow --agent codex --yes
          npx --yes skills@latest list -a codex | tee removed.log
          if grep -q 'agentflow' removed.log; then
            echo "Router was not removed" >&2
            exit 1
          fi

