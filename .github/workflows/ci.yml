name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Lint release and acceptance workflows
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml
      - run: npm run plugins:check
      - run: npm test
      - run: npm run build
      - name: Validate native Claude plugin and marketplace
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate . --strict
      - name: Smoke-test Codex marketplace registration
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @openai/codex@latest plugin marketplace add .
          npx --yes @openai/codex@latest plugin marketplace list | tee codex-marketplaces.log
          grep -q 'agentflow' codex-marketplaces.log
          npx --yes @openai/codex@latest plugin add agentflow@agentflow
          npx --yes @openai/codex@latest plugin list | tee codex-plugins.log
          grep -q 'agentflow' codex-plugins.log
          npx --yes @openai/codex@latest plugin remove agentflow@agentflow
          npx --yes @openai/codex@latest plugin list | tee codex-removed.log
          grep -Eq '^agentflow@agentflow[[:space:]]+not installed' codex-removed.log
      - name: Smoke-test portable skill discovery and install/remove
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$PWD"
          TARGET="$(mktemp -d)"
          trap 'rm -rf "$TARGET"' EXIT
          node --input-type=module -e 'import { EXPECTED } from "./scripts/generate-skills.mjs"; process.stdout.write(EXPECTED.join(String.fromCharCode(10)) + String.fromCharCode(10))' > "$TARGET/expected.txt"
          cd "$TARGET"
          npx --yes skills@1.7.4 add "$SOURCE" --list 2>&1 | tee discovery.log
          if grep -Eq 'Skipped .*SKILL.md|YAML parse error' discovery.log; then
            echo "Installer skipped a canonical skill" >&2
            exit 1
          fi
          while IFS= read -r skill; do
            grep -Fq "$skill" discovery.log || { echo "Missing installed-discovery skill: $skill" >&2; exit 1; }
          done < expected.txt
          npx --yes skills@1.7.4 add "$SOURCE" --skill agentflow --agent codex --copy --yes
          npx --yes skills@1.7.4 list -a codex | tee installed.log
          grep -q 'agentflow' installed.log
          npx --yes skills@1.7.4 remove agentflow --agent codex --yes
          npx --yes skills@1.7.4 list -a codex | tee removed.log
          if grep -q 'agentflow' removed.log; then
            echo "Router was not removed" >&2
            exit 1
          fi

  cli-portability:
    name: CLI / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node --test packages/cli/test/main.test.mjs
      - run: npm pack --dry-run ./packages/cli
      - run: npm install -g ./packages/cli
      - run: agentflow --version
      - run: agentflow init --agent codex --dry-run
      - run: agentflow install --global --agent codex --skill agentflow --dry-run
      - run: agentflow doctor
      - run: agentflow status --project

  published-release-smoke:
    name: Public v0.3.0 npm and GitHub acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check the already-published npm package and release skill
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_SHA: ''
          DISABLE_TELEMETRY: '1'
        run: bash .github/scripts/remote-acceptance.sh v0.3.0 ""
  
  cross-agent-compatibility:
    name: Portable skills / ${{ matrix.agent }}
    strategy:
      fail-fast: false
      matrix:
        agent: [claude-code, codex, gemini-cli, cursor, opencode]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Exercise public package on isolated project and global scope
        shell: bash
        env:
          DISABLE_TELEMETRY: '1'
          AGENT_ID: ${{ matrix.agent }}
        run: bash .github/scripts/cross-agent-acceptance.sh "$AGENT_ID"
