name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test generator
        run: npm test

      - name: Build docs
        run: npm run build

      - name: Verify static routes
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/start/choose-a-skill/index.html
          test -f dist/skills/product-design/index.html
          test -f dist/reference/product-design/index.html

      - name: Validate Cloudflare bundle
        run: npx wrangler deploy --dry-run

      - name: Upload verified site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: agentflow-site
          path: dist/
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets before manual deployment."
            exit 1
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deployment skipped. Configure both GitHub Actions secrets, then run this workflow manually."
          fi

      - name: Checkout
        if: steps.cloudflare.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.cloudflare.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Wrangler
        if: steps.cloudflare.outputs.ready == 'true'
        run: npm ci

      - name: Download verified site
        if: steps.cloudflare.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: agentflow-site
          path: dist/

      - name: Publish Workers Static Assets
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
